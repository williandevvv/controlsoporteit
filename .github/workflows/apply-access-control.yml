name: Apply access control migration

on:
  push:
    paths:
      - scripts/apply-access-control.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node scripts/apply-access-control.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js firestore.rules
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Implement per-user permissions and secure marcajes"
            git push
          fi
